# Dependências locais do serviço de anúncios.
# Por padrão sobem só as dependências e a API/worker rodam no host (pnpm start:dev / start:worker:dev).
# Para subir tudo em containers: docker compose --profile app up -d --build --wait
name: listings

x-app: &app
  profiles: [app]
  build: .
  environment: &app-env
    NODE_ENV: production
    PORT: 3000
    DATABASE_URL: postgres://${POSTGRES_USER:-listings}:${POSTGRES_PASSWORD:-listings}@postgres:5432/${POSTGRES_DB:-listings}
    REDIS_URL: redis://redis:6379
    MODERATION_API_URL: http://moderation-api:8787
    JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env (mínimo de 32 caracteres)}
    OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4318

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-listings}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-listings}
      POSTGRES_DB: ${POSTGRES_DB:-listings}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Filas (BullMQ) e projeção de leitura do detalhe.
  redis:
    image: redis:8.8-alpine
    # BullMQ exige que o Redis nunca descarte chaves por pressão de memória.
    command: ["redis-server", "--maxmemory-policy", "noeviction", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Mock da moderação, construído a partir de backend/api-mock sem alterações.
  moderation-api:
    build: ../api-mock
    environment:
      ERROR_RATE: ${MOCK_ERROR_RATE:-0.2}
      RATE_LIMIT_RPS: ${MOCK_RATE_LIMIT_RPS:-5}
    ports:
      - "${MODERATION_PORT:-8787}:8787"
    cap_drop:
      - ALL

  # Aplica as migrations e termina; API e worker esperam por ele.
  migrate:
    <<: *app
    command: ["node", "dist/cli/db.js", "migrate"]
    depends_on:
      postgres: { condition: service_healthy }

  api:
    <<: *app
    environment:
      <<: *app-env
      OTEL_SERVICE_NAME: listings-api
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  worker:
    <<: *app
    command: ["node", "dist/worker.js"]
    environment:
      <<: *app-env
      OTEL_SERVICE_NAME: listings-worker
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      moderation-api: { condition: service_healthy }

  # Coletor OTel + Prometheus + Tempo + Loki + Grafana num único container.
  otel-lgtm:
    image: grafana/otel-lgtm:0.40.0
    ports:
      - "${GRAFANA_PORT:-3001}:3000" # Grafana (3000 fica para a API)
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
    volumes:
      - lgtm-data:/data
      # Painel da fila de moderação, provisionado por arquivo.
      - ./grafana/dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/listings.yaml:ro
      - ./grafana/moderation-queue.json:/otel-lgtm/listings-dashboards/moderation-queue.json:ro

volumes:
  postgres-data:
  redis-data:
  lgtm-data:
